<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bisztró Különleges Ajánlatai</title>
    <style>
     body {
            background-color: #f7eedb; /* Krémszínű retro háttér */
            color: #2c2c2c;
            font-family: 'Playfair Display', serif;
            margin: 0;
            padding: 0;
        }

        /* Neonos, retró fejléc */
        header {
            background-color: #b73e3e; /* Nosztalgia piros */
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 8px double #ddbc95;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            font-family: 'Bungee', sans-serif;
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f4d160; /* Neon sárga beütés */
            text-shadow: 3px 3px 0px #541212;
        }

         header p {
            font-size: 1.2rem;
            font-style: italic;
            margin-top: 10px;
            color: #f7eedb;
        }

</head>
<body>
    
</body>
</html>
