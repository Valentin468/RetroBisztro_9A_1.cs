<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bisztró Különleges Ajánlatai</title>
    <style>
     body {
            background-color: #f7eedb; /* Krémszínű retro háttér */
            color: #2c2c2c;
            font-family: 'Playfair Display', serif;
            margin: 0;
            padding: 0;
        }

        /* Neonos, retró fejléc */
        header {
            background-color: #b73e3e; /* Nosztalgia piros */
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 8px double #ddbc95;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            font-family: 'Bungee', sans-serif;
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f4d160; /* Neon sárga beütés */
            text-shadow: 3px 3px 0px #541212;
        }

         header p {
            font-size: 1.2rem;
            font-style: italic;
            margin-top: 10px;
            color: #f7eedb;
        }

        /* Konténer */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

         .section-title {
            font-family: 'Bungee', sans-serif;
            text-align: center;
            color: #b73e3e;
            font-size: 2rem;
            margin-bottom: 30px;
            border-bottom: 2px dashed #b73e3e;
            padding-bottom: 10px;
        }

        /* Menü kártyák rácsa */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

         /* Egy-egy ajánlat kártyája */
        .menu-item {
            background: #ffffff;
            border: 3px solid #ddbc95;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            box-shadow: 5px 5px 0px #b73e3e;
            transition: transform 0.2s ease;
        }

        .menu-item:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px #b73e3e;
        }

        /* Különleges plecsni */
        .badge {
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: #f4d160;
            color: #541212;
            font-family: 'Bungee', sans-serif;
            font-size: 0.8rem;
            padding: 5px 10px;
            transform: rotate(5px);
            border: 2px solid #541212;
            border-radius: 4px;
        }

         .menu-item h3 {
            font-size: 1.5rem;
            margin-top: 10px;
            margin-bottom: 10px;
            color: #b73e3e;
        }

         .menu-item p {
            font-size: 1rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 20px;
        }

        .price {
            font-family: 'Bungee', sans-serif;
            font-size: 1.3rem;
            color: #2c2c2c;
            text-align: right;
            display: block;
        }

         /* Lábléc */
        footer {
            background-color: #2c2c2c;
            color: #ddbc95;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 0.9rem;
        }

        footer p {
            margin: 5px 0;
        }









</head>
<body>
    
</body>
</html>
