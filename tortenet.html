<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retró Bisztró</title>
</head>
<body>

         <style>
        /* Alapbeállítások és Retró Színpaletta */
        :root {
            --retro-cream: #F4EAE1;
            --retro-red: #C84B31;
            --retro-mustard: #D9B44A;
            --retro-teal: #2D4263;
            --retro-dark: #1A1A1A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Retró írógép stílusú betűtípus */
        }

        body {
            background-color: var(--retro-cream);
            color: var(--retro-dark);
            line-height: 1.6;
        }

        /* Fejléc / Hero szekció */
        header {
            background-color: var(--retro-red);
            color: white;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 8px dashed var(--retro-mustard);
        }

        header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0px var(--retro-teal);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--retro-cream);
        }

         /* Navigáció (Dísznek) */
        nav {
            background-color: var(--retro-teal);
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: var(--retro-cream);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        nav a:hover {
            color: var(--retro-mustard);
        }

        /* Fő tartalom container */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 3px solid var(--retro-dark);
            box-shadow: 10px 10px 0px var(--retro-mustard);
        }

        * Történet szekció stílusai */
        .story-section h2 {
            font-size: 2rem;
            color: var(--retro-red);
            border-bottom: 3px solid var(--retro-teal);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .story-section p {
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-align: justify;
        }

                /* Kiemelt idézet / Hangulatjelentés */
        blockquote {
            background-color: var(--retro-cream);
            border-left: 5px solid var(--retro-red);
            padding: 15px;
            margin: 30px 0;
            font-style: italic;
            color: var(--retro-teal);
            font-weight: bold;
        }

        /* Kis étlap ízelítő doboz */
        .menu-preview {
            margin-top: 40px;
            background-color: var(--retro-teal);
            color: white;
            padding: 20px;
            border-radius: 4px;
        }

        .menu-preview h3 {
            color: var(--retro-mustard);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .menu-preview ul {
            list-style-type: "🥞 ";
            padding-left: 20px;
        }

        .menu-preview li {
            margin-bottom: 8px;
        }

        /* Lábléc */
        footer {
            background-color: var(--retro-dark);
            color: var(--retro-cream);
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            font-size: 0.9rem;
        }

         /* Mobil optimalizálás */
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .container { width: 90%; box-shadow: 5px 5px 0px var(--retro-mustard); }
        }

     <!-- FEJLÉC-->
    <header>
        <h1>Retró bisztró</h1>
        <p>Ahol megállt az idő, és a presszókávé még mindig igazi.</p>
    </header>
<!-- NAVIGÁCIÓ -->
    <nav>
        <a href="#tortenet">Történetünk</a>
        <a href="#hangulat">Hangulat</a>
        <a href="#ajanlat">Retró Kínálat</a>
    </nav>

     <!-- TARTALOM -->
    <div class="container">
        
        <section id="tortenet" class="story-section">
            <h2>A Mi Történetünk</h2>
            
            <p>Minden 1982 őszén kezdődött, egy hűvös októberi kedden. Nagypapánk, Géza bácsi – aki világéletében híres volt arról, hogy nála főtt a környék legerősebb feketéje – megelégelte az unalmas, szürke hétköznapokat, és megnyitotta a kerület első privát kis bisztróját.</p>

            <p>A névválasztás nem volt nehéz: a sarokban egy kopott, de büszke Tesla lemezjátszó pörgette a korszak legnagyobb slágereit, a vendégek asztalára pedig jéghideg, üveges Bambi szódák kerültek. Így született meg a <strong>Bambi & Bakelit</strong>.</p>

            <blockquote>
                "Nálunk a zene bakelitről szól, a történetek a pultnál születnek, a rántott hús pedig akkora, hogy lelóg a piros-fehér kockás tányérról."
            </blockquote>

            <p>A 80-as és 90-es években a bisztró igazi közösségi csomóponttá vált. Itt vitatták meg a helyi gyári munkások a foci meccsek eredményeit, ide jártak a fiatalok randizni a neonfények alá, és nem egyszer fordult elő, hogy ismert zenészek is betértek egy-egy fellépés után egy kiadós, tormás virslire.</p>

            <p>Bár az idők változtak, és a világ felgyorsult körülöttünk, mi úgy döntöttünk, hogy nálunk minden marad a régiben. Amikor belépsz hozzánk, a piros műbőr székek, a falon függő régi moziplakátok és a retró slágerek azonnal visszarepítenek az időben.</p>
        </section>

        <section id="hangulat" class="story-section" style="margin-top: 40px;">
            <h2>A Titok: Semmi Újhullám, Csak a Hagyomány</h2>
            <p>Nálunk nincsen avokádós pirítós vagy fenszi latte. Mi hiszünk a csemegeuborka tökéletességében, a retró melegszendvicskrém titkos receptjében és abban, hogy a szódát szifonból kell engedni. A bútoraink eredetiek, a mosolyunk őszinte, a nosztalgia pedig garantált.</p>
        </section>

        <!-- RETRÓ KÍNÁLAT DOBOZ -->
        <section id="ajanlat" class="menu-preview">
            <h3>Géza Bácsi Kedvencei</h3>
            <ul>
                <li><strong>Klasszikus Melegszendvics</strong> – Gazdagon megkenve a titkos retró krémmel, reszelt sajttal sütve.</li>
                <li><strong>Maci Fröccs & Bambi</strong> – Az elmaradhatatlan folyékony nosztalgia.</li>
                <li><strong>Presszó Kávé</strong> – Ahogy a nyolcvanas években szerettük: feketén, kockacukorral.</li>
                <li><strong>Emeletes Habos Palacsinta</strong> – Házi baracklekvárral, pont úgy, ahogy a nagyi csinálta.</li>
            </ul>
        </section>

    </div>

     <!-- LÁBLÉC -->
    <footer>
        <p>&copy; 1982 - 2026 Retró bisztró. Minden jog fenntartva.</p>
        <p style="font-size: 0.8rem; margin-top: 5px; color: #888;">Nyitva: Hétfőtől-Szombatig 10:00 - 22:00 | Cím: A Nosztalgia Sugárút 74.</p>
    </footer>

    </body>
</html>
