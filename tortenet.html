<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retró Bisztró</title>
</head>
<body>
     <style>
        /* Alapbeállítások és Retró Színpaletta */
        :root {
            --retro-cream: #F4EAE1;
            --retro-red: #C84B31;
            --retro-mustard: #D9B44A;
            --retro-teal: #2D4263;
            --retro-dark: #1A1A1A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Retró írógép stílusú betűtípus */
        }

        body {
            background-color: var(--retro-cream);
            color: var(--retro-dark);
            line-height: 1.6;
        }

        /* Fejléc / Hero szekció */
        header {
            background-color: var(--retro-red);
            color: white;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 8px dashed var(--retro-mustard);
        }

        header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0px var(--retro-teal);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--retro-cream);
        }

         /* Navigáció (Dísznek) */
        nav {
            background-color: var(--retro-teal);
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: var(--retro-cream);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        nav a:hover {
            color: var(--retro-mustard);
        }

        /* Fő tartalom container */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 3px solid var(--retro-dark);
            box-shadow: 10px 10px 0px var(--retro-mustard);
        }

        * Történet szekció stílusai */
        .story-section h2 {
            font-size: 2rem;
            color: var(--retro-red);
            border-bottom: 3px solid var(--retro-teal);
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .story-section p {
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-align: justify;
        }

                /* Kiemelt idézet / Hangulatjelentés */
        blockquote {
            background-color: var(--retro-cream);
            border-left: 5px solid var(--retro-red);
            padding: 15px;
            margin: 30px 0;
            font-style: italic;
            color: var(--retro-teal);
            font-weight: bold;
        }

        /* Kis étlap ízelítő doboz */
        .menu-preview {
            margin-top: 40px;
            background-color: var(--retro-teal);
            color: white;
            padding: 20px;
            border-radius: 4px;
        }



    


    
</body>
</html>
