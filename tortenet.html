<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retró Bisztró</title>
</head>
<body>
     <style>
        /* Alapbeállítások és Retró Színpaletta */
        :root {
            --retro-cream: #F4EAE1;
            --retro-red: #C84B31;
            --retro-mustard: #D9B44A;
            --retro-teal: #2D4263;
            --retro-dark: #1A1A1A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Retró írógép stílusú betűtípus */
        }

        body {
            background-color: var(--retro-cream);
            color: var(--retro-dark);
            line-height: 1.6;
        }
    
</body>
</html>
