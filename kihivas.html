<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Giga-Pizza Challenge</title>
     <style>
      /* Retró stíluslap */
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            text-align: center;
        }

         header {
            background: linear-gradient(45deg, #ff0055, #ffcc00);
            padding: 40px;
            border-bottom: 8px double #fff;
            text-shadow: 3px 3px #000;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'), #222;
            border: 5px solid #ffcc00;
            box-shadow: 0 0 20px #ffcc00;
        }

         .hero-image {
            width: 100%;
            border: 10px solid #fff;
            box-sizing: border-box;
            filter: contrast(1.2) saturate(1.5);
        }

          .challenge-box {
            background-color: #aa0000;
            padding: 30px;
            margin: 30px 0;
            border: 4px dashed #fff;
        }

</head>

</body>
</html>
